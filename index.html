<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BloxStreet Receipt Generator</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
}

h1{
    text-align:center;
}

.item{
    display:flex;
    justify-content:space-between;
    margin:12px 0;
}

.qty-controls button{
    width:35px;
    height:35px;
}

.qty{
    display:inline-block;
    width:30px;
    text-align:center;
    font-weight:bold;
}

.receipt{
    margin-top:20px;
    border:1px solid #ccc;
    padding:20px;
    border-radius:10px;
    background:#fafafa;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:8px;
    border-bottom:1px solid #ddd;
}
</style>
</head>

<body>

<div class="container">

<h1>BloxStreet</h1>
<p style="text-align:center;">by rizzy</p>

<input
type="text"
id="customer"
placeholder="Purchaser Name"
style="width:100%;padding:10px;">

<br><br>

<div class="item">
    <span>Premium Account (50 QAR)</span>
    <div class="qty-controls">
        <button onclick="changeQty('premium',-1)">-</button>
        <span id="premium" class="qty">0</span>
        <button onclick="changeQty('premium',1)">+</button>
    </div>
</div>

<div class="item">
    <span>Pro Account (35 QAR)</span>
    <div class="qty-controls">
        <button onclick="changeQty('pro',-1)">-</button>
        <span id="pro" class="qty">0</span>
        <button onclick="changeQty('pro',1)">+</button>
    </div>
</div>

<div class="item">
    <span>Mid Account (15 QAR)</span>
    <div class="qty-controls">
        <button onclick="changeQty('mid',-1)">-</button>
        <span id="mid" class="qty">0</span>
        <button onclick="changeQty('mid',1)">+</button>
    </div>
</div>

<div class="item">
    <span>I.G.A (10 QAR)</span>
    <div class="qty-controls">
        <button onclick="changeQty('iga',-1)">-</button>
        <span id="iga" class="qty">0</span>
        <button onclick="changeQty('iga',1)">+</button>
    </div>
</div>

<div class="item">
    <span>I.G-VIP (20 QAR / Month)</span>
    <div class="qty-controls">
        <button onclick="changeQty('vip',-1)">-</button>
        <span id="vip" class="qty">0</span>
        <button onclick="changeQty('vip',1)">+</button>
    </div>
</div>

<br>

<button onclick="generateReceipt()">
Generate Receipt
</button>

<div id="output"></div>

</div>

<script>

function changeQty(id, amount){
    let value = Number(document.getElementById(id).textContent);
    value += amount;

    if(value < 0){
        value = 0;
    }

    document.getElementById(id).textContent = value;
}

function generateReceipt(){

    const items = [
        ["Premium Account",50,"premium"],
        ["Pro Account",35,"pro"],
        ["Mid Account",15,"mid"],
        ["I.G.A",10,"iga"],
        ["I.G-VIP",20,"vip"]
    ];

    let receiptRows = "";
    let total = 0;

    for(let item of items){

        let qty =
        Number(document.getElementById(item[2]).textContent);

        if(qty > 0){

            let cost = qty * item[1];
            total += cost;

            receiptRows += `
            <tr>
                <td>${item[0]}</td>
                <td>${qty}</td>
                <td>${cost} QAR</td>
            </tr>
            `;
        }
    }

    let customer =
    document.getElementById("customer").value;

    let date =
    new Date().toLocaleDateString();

    document.getElementById("output").innerHTML = `
    <div class="receipt">

    <h2 style="text-align:center;">
    BloxStreet
    </h2>

    <p style="text-align:center;">
    by rizzy
    </p>

    <hr>

    <p><b>Date:</b> ${date}</p>
    <p><b>Purchaser:</b> ${customer}</p>

    <table>
        <tr>
            <th>Item</th>
            <th>Qty</th>
            <th>Price</th>
        </tr>

        ${receiptRows}
    </table>

    <h3>Total: ${total} QAR</h3>

    </div>
    `;
}
</script>

</body>
</html>
