<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BloxStreet Receipt Generator</title>

<style>
body{
    font-family: Arial, sans-serif;
    padding:20px;
    background:#f5f5f5;
}

h1{
    margin-bottom:20px;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    max-width:500px;
    background:white;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
}

.controls button{
    width:30px;
    height:30px;
    font-size:18px;
}

.qty{
    margin:0 10px;
    font-weight:bold;
}

.receipt{
    background:white;
    margin-top:25px;
    padding:20px;
    width:400px;
    border:1px solid #ddd;
}

.logo{
    width:120px;
    display:block;
    margin:auto;
}

.center{
    text-align:center;
}
</style>
</head>

<body>

<h1>BloxStreet Receipt Generator</h1>

<input type="text" id="customer" placeholder="Purchaser Name">

<br><br>

<div class="item">
    <span>Premium Account (50 QAR)</span>
    <div class="controls">
        <button onclick="changeQty('premium',-1)">-</button>
        <span id="premium">0</span>
        <button onclick="changeQty('premium',1)">+</button>
    </div>
</div>

<div class="item">
    <span>Pro Account (35 QAR)</span>
    <div class="controls">
        <button onclick="changeQty('pro',-1)">-</button>
        <span id="pro">0</span>
        <button onclick="changeQty('pro',1)">+</button>
    </div>
</div>

<div class="item">
    <span>Mid Account (15 QAR)</span>
    <div class="controls">
        <button onclick="changeQty('mid',-1)">-</button>
        <span id="mid">0</span>
        <button onclick="changeQty('mid',1)">+</button>
    </div>
</div>

<div class="item">
    <span>I.G.A (10 QAR)</span>
    <div class="controls">
        <button onclick="changeQty('iga',-1)">-</button>
        <span id="iga">0</span>
        <button onclick="changeQty('iga',1)">+</button>
    </div>
</div>

<div class="item">
    <span>I.G-VIP (20 QAR / Month)</span>
    <div class="controls">
        <button onclick="changeQty('vip',-1)">-</button>
        <span id="vip">0</span>
        <button onclick="changeQty('vip',1)">+</button>
    </div>
</div>

<br>

<button onclick="generateReceipt()">Generate Receipt</button>

<div id="receipt"></div>

<script>

function changeQty(id, amount){
    let current = parseInt(document.getElementById(id).innerText);

    current += amount;

    if(current < 0){
        current = 0;
    }

    document.getElementById(id).innerText = current;
}

function generateReceipt(){

    let total = 0;
    let items = "";

    const products = [
        ["Premium Account",50,"premium"],
        ["Pro Account",35,"pro"],
        ["Mid Account",15,"mid"],
        ["I.G.A",10,"iga"],
        ["I.G-VIP Months",20,"vip"]
    ];

    products.forEach(product => {

        let qty = parseInt(document.getElementById(product[2]).innerText);

        if(qty > 0){

            let price = qty * product[1];

            items += `
                <tr>
                    <td>${product[0]}</td>
                    <td>${qty}</td>
                    <td>${price} QAR</td>
                </tr>
            `;

            total += price;
        }
    });

    let purchaser = document.getElementById("customer").value;
    let date = new Date().toLocaleDateString();

    document.getElementById("receipt").innerHTML = `

    <div class="receipt">

        <img src="logo.png" class="logo">

        <div class="center">
            <h2>BloxStreet</h2>
            <small>by rizzy</small>
        </div>

        <hr>

        <p><b>Date:</b> ${date}</p>
        <p><b>Purchaser:</b> ${purchaser}</p>

        <table width="100%">
            <tr>
                <th align="left">Item</th>
                <th>Qty</th>
                <th align="right">Price</th>
            </tr>

            ${items}
        </table>

        <hr>

        <h3>Total: ${total} QAR</h3>

        <p>Thank you for purchasing!</p>

    </div>

    `;
}
</script>

</body>
</html>
