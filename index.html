<!DOCTYPE html>
<html>
<head>
    <title>Receipt Maker</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        .receipt {
            border: 1px solid black;
            padding: 10px;
            margin-top: 20px;
            width: 350px;
        }
    </style>
</head>
<body>

<h2>Receipt Generator</h2>

<input type="text" id="name" placeholder="Purchaser Name">

<h3>Select Items</h3>

<label>
    <input type="checkbox" id="premium">
    Premium Account (50 QAR)
</label><br>

<label>
    <input type="checkbox" id="pro">
    Pro Account (35 QAR)
</label><br>

<label>
    <input type="checkbox" id="mid">
    Mid Account (15 QAR)
</label><br>

<label>
    <input type="checkbox" id="iga">
    I.G.A (10 QAR)
</label><br><br>

<label>
    I.B-VIP Months:
    <input type="number" id="vipMonths" value="0" min="0">
    (5 QAR/month)
</label><br><br>

<button onclick="generateReceipt()">Generate Receipt</button>

<div id="output"></div>

<script>
function generateReceipt() {

    let total = 0;
    let items = [];

    if(document.getElementById("premium").checked){
        items.push("Premium Account - 50 QAR");
        total += 50;
    }

    if(document.getElementById("pro").checked){
        items.push("Pro Account - 35 QAR");
        total += 35;
    }

    if(document.getElementById("mid").checked){
        items.push("Mid Account - 15 QAR");
        total += 15;
    }

    if(document.getElementById("iga").checked){
        items.push("I.G.A - 10 QAR");
        total += 10;
    }

    let months = Number(document.getElementById("vipMonths").value);

    if(months > 0){
        let vipCost = months * 5;
        items.push(`I.B-VIP (${months} month(s)) - ${vipCost} QAR`);
        total += vipCost;
    }

    let today = new Date().toLocaleDateString();
    let purchaser = document.getElementById("name").value;

    document.getElementById("output").innerHTML = `
        <div class="receipt">
            <h3>Receipt</h3>
            <p><b>Date:</b> ${today}</p>
            <p><b>Purchaser:</b> ${purchaser}</p>

            <p><b>Bought Items:</b></p>
            <ul>
                ${items.map(item => `<li>${item}</li>`).join("")}
            </ul>

            <hr>

            <p><b>Total:</b> ${total} QAR</p>
        </div>
    `;
}
</script>

</body>
</html>
