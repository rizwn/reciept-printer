<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BloxStreet Receipt Generator</title>

<style>
body{
    font-family: Arial, sans-serif;
    padding:20px;
    background:#f5f5f5;
}

.logo{
    width:180px;
    display:block;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:white;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    max-width:500px;
}

.controls button{
    width:35px;
    height:35px;
    font-size:18px;
    cursor:pointer;
}

.controls span{
    margin:0 10px;
    font-weight:bold;
    font-size:18px;
}

.receipt{
    background:white;
    width:450px;
    padding:20px;
    margin-top:25px;
    border:1px solid #ccc;
    border-radius:10px;
}

.receipt-logo{
    width:120px;
    display:block;
    margin:auto;
}

.center{
    text-align:center;
}

input{
    padding:8px;
    width:250px;
}

.generate
